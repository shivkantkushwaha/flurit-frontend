services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-https://flurit-backend.onrender.com/api/v1}
        NEXT_PUBLIC_ENABLE_MSW: ${NEXT_PUBLIC_ENABLE_MSW:-false}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-https://mnxliofkpmhpsvoechlk.supabase.co}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-sb_publishable__0SvpqLgQO11CBCLbyMSWA_MmTCkGku}
    image: flurit-frontend:latest
    container_name: flurit-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    restart: unless-stopped
